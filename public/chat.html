<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat da Mabel</title>
    <link rel="stylesheet" href="./style4.css">
</head>

<body>
    <nav class="menu">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="galeria.html">Galeria</a>
        <a class="link" href="chat.html">Chat</a>
        <a class="link" id="linkCadastro" href="cadastro.html">Cadastro</a>
    </nav>

    <!-- Tela de Aviso para Usuários não autenticados -->
    <div id="telaAviso" class="overlay-aviso" style="display: none;">
        <div class="card-aviso">
            <h2>Acesso Restrito</h2>
            <p>Para conversar com a Mabel, você precisa criar uma conta ou fazer o login!</p>
            <div class="botoes-aviso">
                <a href="cadastro.html" class="btn-aviso btn-aviso-cadastro">Criar Conta</a>
                <a href="login.html" class="btn-aviso btn-aviso-login">Fazer Login</a>
            </div>
        </div>
    </div>

    <!-- Área Principal do Chat -->
    <main class="chat-container" id="areaChat" style="display: none;">
        <h2 id="boasVindas">Olá, seja bem-vinda(o) ao chat da Mabel</h2>
        <div id="caixaChat"></div>

        <div id="inputArea">
            <input type="text" id="mensagem" placeholder="Digite sua mensagem..." aria-label="Digite sua mensagem">
            <button id="btnEnviar">Enviar</button>
        </div>
    </main>

    <footer>
        <p>© Site desenvolvido por Ana Julia / 2026 Curitiba</p>
    </footer>

    <script>
        const token = localStorage.getItem('token');
        const telaAviso = document.querySelector('#telaAviso');
        const areaChat = document.querySelector('#areaChat');

        // Se não tiver token, exibe a tela de aviso e oculta o chat
        if (!token) {
            telaAviso.style.display = 'flex';
            areaChat.style.display = 'none';
        } else {
            telaAviso.style.display = 'none';
            areaChat.style.display = 'flex';
        }

        const usuarioLogado = localStorage.getItem('usuario') || 'Usuário';

        document.querySelector('#boasVindas').textContent = `Olá ${usuarioLogado}, seja bem-vinda(o) ao chat da Mabel`;

        const caixaChat = document.querySelector('#caixaChat');
        const inputMensagem = document.querySelector('#mensagem');
        const btnEnviar = document.querySelector('#btnEnviar');

        const historicoConversa = [];

        function mensagemTela(autor, texto) {
            const textoFinal = document.createElement('p');
            textoFinal.className = 'msg';
            if (autor === 'Mabel') {
                textoFinal.classList.add('msg-mabel');
            } else if (autor === 'system') {
                textoFinal.classList.add('msg-system');
            } else {
                textoFinal.classList.add('msg-user');
            }
            textoFinal.textContent = `${autor}: ${texto}`;
            caixaChat.appendChild(textoFinal);
            caixaChat.scrollTop = caixaChat.scrollHeight;
        }

        btnEnviar.addEventListener('click', async () => {
            const textoMensagem = inputMensagem.value.trim();
            if (!textoMensagem) return;

            mensagemTela(usuarioLogado, textoMensagem);
            historicoConversa.push({ role: 'user', content: textoMensagem });

            inputMensagem.value = '';
            btnEnviar.disabled = true;

            try {
                const respostaServidor = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ historico: historicoConversa })
                });

                const dados = await respostaServidor.json();

                if (!respostaServidor.ok) {
                    mensagemTela('system', dados.erro || 'Erro no servidor');
                    return;
                }

                mensagemTela('Mabel', dados.resposta);
                historicoConversa.push({ role: 'assistant', content: dados.resposta });
            } catch (erro) {
                console.error('Erro ao enviar mensagem:', erro);
                mensagemTela('system', 'Erro ao conectar com o servidor');
            } finally {
                btnEnviar.disabled = false;
            }
        });

        inputMensagem.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !btnEnviar.disabled) {
                btnEnviar.click();
            }
        });
    </script>
</body>

</html>
